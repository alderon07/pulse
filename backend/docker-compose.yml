services:
  postgres:
    image: postgres:16
    container_name: pulse-postgres
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: golang:1.26
    container_name: pulse-migrate
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse?sslmode=disable
    volumes:
      - .:/workspace
    command: ["sh", "-c", "go install github.com/pressly/goose/v3/cmd/goose@v3.26.0 && /go/bin/goose -dir migrations postgres \"$DATABASE_URL\" up"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["ops"]

  api:
    build:
      context: .
      dockerfile: build/Dockerfile.api
    container_name: pulse-api
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse?sslmode=disable
      WORKER_TICK_SECONDS: 60
      OVERDUE_BATCH_SIZE: 200
      DELIVERY_BATCH_SIZE: 100
      ALERT_REPEAT_MINUTES: 60
      PING_RATE_PER_MIN: 60
      PING_RATE_BURST: 20
      INVALID_TOKEN_RATE_PER_MIN: 30
      INVALID_TOKEN_BURST: 10
      WEBHOOK_TIMEOUT_SECONDS: 5
      IDEMPOTENCY_TTL_HOURS: 24
      JWT_HS256_SECRET: dev-secret-change-me
      TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: build/Dockerfile.worker
    container_name: pulse-worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse?sslmode=disable
      WORKER_TICK_SECONDS: 60
      OVERDUE_BATCH_SIZE: 200
      DELIVERY_BATCH_SIZE: 100
      ALERT_REPEAT_MINUTES: 60
      WEBHOOK_TIMEOUT_SECONDS: 5
      IDEMPOTENCY_TTL_HOURS: 24
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
